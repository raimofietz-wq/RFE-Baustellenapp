<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Foto hinzufügen</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="header">

    <img src="../assets/logo.png"
         class="logo"
         alt="Firmenlogo">

    <div class="firma">
        <h1 id="titel">Foto hinzufügen</h1>
        <p>Raimo Fietz Elektrotechnik</p>
    </div>

</header>

<main>

<div class="karte">

    <h2>Bild auswählen</h2>

    <!-- Öffnet auf dem iPad direkt die Kamera -->
    <label for="kamera">Foto aufnehmen</label>

    <input
        type="file"
        id="kamera"
        accept="image/*"
        capture="environment"
    >

    <!-- Öffnet Mediathek beziehungsweise Dateien/iCloud -->
    <label for="mediathek">
        Aus Mediathek oder Dateien auswählen
    </label>

    <input
        type="file"
        id="mediathek"
        accept="image/*"
    >

    <p id="status"></p>

    <img
        id="vorschau"
        alt="Fotovorschau"
        style="display:none;"
    >

    <button
        class="button-speichern"
        id="speichernButton"
        onclick="speichern()"
        disabled>
        💾 Foto speichern
    </button>

    <button
        class="button-zurueck"
        onclick="zurueck()">
        ← Zurück
    </button>

</div>

</main>

<script src="../js/database.js"></script>
<script src="../js/foto-database.js"></script>
<script src="../js/foto.js"></script>

</body>
</html>
